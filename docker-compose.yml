services:
  apgdb:
    image: mysql:9.7
    container_name: base_inventario
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: db_inventario
    ports:
      - 3309:3306
    volumes:
      - ./db_dump:/docker-entrypoint-initdb.d
      - ./mysql:/var/lib/mysql
    secrets:
      - db_password

  apgwebdatos:
    container_name: inventario_datos
    volumes:
      - ./Data/public:/var/www/html/public
      - ./Data/src:/var/www/html/src
    
    build:
      context: .
      dockerfile: ./Data/Dockerfile
    ports: 
      - 8090:80
    depends_on:
      - apgdb

  apgwebnegocio:
    container_name: web_negocio_inventario

    volumes:
      - ./Business/public:/var/www/html/public
      - ./Business/src:/var/www/html/src
  
    build:
      context: .
      dockerfile: ./Business/Dockerfile
    ports: 
      - 9090:80
    depends_on:
      - apgwebdatos
  
  

secrets:
  db_password:
    file: ./db_password.txt